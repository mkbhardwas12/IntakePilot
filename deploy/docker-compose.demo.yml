# Public demo posture — mock LLM, SQLite, rate limits, secrets required.
# Usage:
#   cp deploy/.env.demo.example deploy/.env.demo
#   # edit secrets
#   docker compose -f deploy/docker-compose.demo.yml --env-file deploy/.env.demo up --build
#
# Bind behind a reverse proxy / TLS terminator. CORS is locked to DEMO_ORIGIN.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      INTAKEPILOT_LLM: mock
      INTAKEPILOT_STORE: sqlite
      INTAKEPILOT_VECTOR: local
      INTAKEPILOT_TARGET: local
      INTAKEPILOT_ADMIN_TOKEN: ${INTAKEPILOT_ADMIN_TOKEN:?set admin token}
      INTAKEPILOT_WEBHOOK_SECRET: ${INTAKEPILOT_WEBHOOK_SECRET:?set webhook secret}
      INTAKEPILOT_JIRA_WEBHOOK_SECRET: ${INTAKEPILOT_JIRA_WEBHOOK_SECRET:-}
      INTAKEPILOT_DEMO: "1"
      INTAKEPILOT_CORS_ORIGINS: ${DEMO_ORIGIN:-http://localhost:3000}
    volumes:
      - demo-data:/app/data
      - demo-tickets:/app/examples/demo-repo
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web.prod
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  demo-data:
  demo-tickets:
