[project]
name = "intakepilot"
version = "0.1.0"
description = "AI requirements-intake platform: deterministic orchestration, LLM as component"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = { find = { include = ["core*"] } }
