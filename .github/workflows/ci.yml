name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Golden-set eval report (mock baseline)
        run: python -m evals.harness

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: intakepilot
          POSTGRES_PASSWORD: test
          POSTGRES_DB: intakepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intakepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: E2E against Postgres + pgvector
        env:
          DATABASE_URL: postgresql://intakepilot:test@localhost:5432/intakepilot
          INTAKEPILOT_STORE: postgres
          INTAKEPILOT_VECTOR: pgvector
          INTAKEPILOT_LLM: mock
        run: python -m pytest -q tests/test_e2e.py tests/test_share.py tests/test_sse_decisions.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
